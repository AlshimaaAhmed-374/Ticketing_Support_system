apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: ticketing-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: ticketing/auth-service:test
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6001
          envFrom:
            - configMapRef:
                name: auth-service-config
            - secretRef:
                name: auth-service-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "400m"
              memory: "256Mi"
          startupProbe:
            httpGet:
              path: /health
              port: 6001
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 6001
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 6001
            initialDelaySeconds: 20
            periodSeconds: 20
---
