---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ticketing-test-ingress
  namespace: ticketing-test
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "4m"
spec:
  ingressClassName: nginx
  rules:
    - host: test.ticketing.local
      http:
        paths:
          - path: /api/tickets
            pathType: Prefix
            backend:
              service:
                name: ticket-service
                port:
                  number: 6002
          - path: /api/notifications
            pathType: Prefix
            backend:
              service:
                name: notification-service
                port:
                  number: 6004
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 6001
          - path: /api/notify
            pathType: Prefix
            backend:
              service:
                name: notification-service
                port:
                  number: 6004
          - path: /assign
            pathType: Prefix
            backend:
              service:
                name: support-service
                port:
                  number: 6003
          - path: /respond
            pathType: Prefix
            backend:
              service:
                name: support-service
                port:
                  number: 6003
          - path: /resolve
            pathType: Prefix
            backend:
              service:
                name: support-service
                port:
                  number: 6003
          - path: /support
            pathType: Prefix
            backend:
              service:
                name: support-service
                port:
                  number: 6003
          - path: /report
            pathType: Prefix
            backend:
              service:
                name: reporting-service
                port:
                  number: 6005
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
