apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-service-config
  namespace: ticketing-test
data:
  NODE_ENV: "test"
  PORT: "6001"
  JWT_EXPIRES_IN: "1d"
  CORS_ORIGIN: "*"
---
apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secret
  namespace: ticketing-test
type: Opaque
stringData:
  MONGO_URI: mongodb://mongo-auth:27017/authdb_test
  JWT_SECRET: change-me-super-secret
---
