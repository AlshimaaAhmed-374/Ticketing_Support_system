apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-service-config
  namespace: ticketing-prod
data:
  NODE_ENV: "production"
  PORT: "7001"
  JWT_EXPIRES_IN: "1d"
  CORS_ORIGIN: "*"
---
apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secret
  namespace: ticketing-prod
type: Opaque
stringData:
  MONGO_URI: mongodb://mongo-auth:27017/authdb_prod
  JWT_SECRET: change-me-super-secret
---
