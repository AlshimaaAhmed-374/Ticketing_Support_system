apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: ticketing-prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: ticketing/auth-service:prod
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 7001
          envFrom:
            - configMapRef:
                name: auth-service-config
            - secretRef:
                name: auth-service-secret
          resources:
            requests:
              cpu: "150m"
              memory: "128Mi"
            limits:
              cpu: "800m"
              memory: "512Mi"
          startupProbe:
            httpGet:
              path: /health
              port: 7001
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 7001
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 7001
            initialDelaySeconds: 20
            periodSeconds: 20
---
