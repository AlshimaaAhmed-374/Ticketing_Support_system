---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ticketing-prod-ingress
  namespace: ticketing-prod
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "4m"
spec:
  ingressClassName: nginx
  rules:
    - host: prod.ticketing.local
      http:
        paths:
          - path: /api/tickets
            pathType: Prefix
            backend:
              service:
                name: ticket-service
                port:
                  number: 7002
          - path: /api/notifications
            pathType: Prefix
            backend:
              service:
                name: notification-service
                port:
                  number: 7004
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 7001
          - path: /api/notify
            pathType: Prefix
            backend:
              service:
                name: notification-service
                port:
                  number: 7004
          - path: /assign
            pathType: Prefix
            backend:
              service:
                name: support-service
                port:
                  number: 7003
          - path: /respond
            pathType: Prefix
            backend:
              service:
                name: support-service
                port:
                  number: 7003
          - path: /resolve
            pathType: Prefix
            backend:
              service:
                name: support-service
                port:
                  number: 7003
          - path: /support
            pathType: Prefix
            backend:
              service:
                name: support-service
                port:
                  number: 7003
          - path: /report
            pathType: Prefix
            backend:
              service:
                name: reporting-service
                port:
                  number: 7005
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
