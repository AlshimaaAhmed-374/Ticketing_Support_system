apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.prod.yml
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: reporting-service
  name: reporting-service
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: reporting-service
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.prod.yml
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: reporting-service
    spec:
      containers:
        - envFrom:
            - configMapRef:
                name: reporting-service--env-prod
          image: docker-reporting-service:latest
          imagePullPolicy: IfNotPresent
          name: reporting-service
          ports:
            - containerPort: 7005
              protocol: TCP
      restartPolicy: Always
