apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ticketing-dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        # Bump this string after rebuilding the frontend image so apply forces a new rollout (same image tag otherwise stays cached on running pods).
        ticketing.dev/configVersion: "k8s-api-paths-v2"
    spec:
      containers:
        - name: frontend
          image: ticketing/frontend:k8s-dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: ticketing-dev
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ticketing-dev-ingress
  namespace: ticketing-dev
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "4m"
spec:
  ingressClassName: nginx
  rules:
    - host: dev.ticketing.local
      http:
        paths:
          # Longer prefixes first (/api/* avoids clashes with SPA routes /tickets, /notifications)
          - path: /api/tickets
            pathType: Prefix
            backend:
              service:
                name: ticket-service
                port:
                  number: 5002
          - path: /api/notifications
            pathType: Prefix
            backend:
              service:
                name: notification-service
                port:
                  number: 5004
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 5001
          - path: /api/notify
            pathType: Prefix
            backend:
              service:
                name: notification-service
                port:
                  number: 5004
          - path: /assign
            pathType: Prefix
            backend:
              service:
                name: support-service
                port:
                  number: 5003
          - path: /respond
            pathType: Prefix
            backend:
              service:
                name: support-service
                port:
                  number: 5003
          - path: /resolve
            pathType: Prefix
            backend:
              service:
                name: support-service
                port:
                  number: 5003
          - path: /support
            pathType: Prefix
            backend:
              service:
                name: support-service
                port:
                  number: 5003
          - path: /report
            pathType: Prefix
            backend:
              service:
                name: reporting-service
                port:
                  number: 5005
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
