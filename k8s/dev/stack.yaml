apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-service-config
  namespace: ticketing-dev
data:
  NODE_ENV: "development"
  PORT: "5001"
  JWT_EXPIRES_IN: "1d"
  CORS_ORIGIN: "*"
---
apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secret
  namespace: ticketing-dev
type: Opaque
stringData:
  MONGO_URI: mongodb://mongo-auth:27017/authdb
  JWT_SECRET: change-me-super-secret
---
